openapi: 3.1.0
info:
  title: RestoCore - Canvas Layout & AOT Compilation Contracts
  version: 1.1.0

paths:
  /api/v1/admin/menu/layout:
    put:
      tags:
        - Admin - Menu & Canvas Layout
      summary: Guardar o restablecer configuración de maquetación de lienzo (Canvas Layout)
      operationId: updateMenuLayout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutConfig'
      responses:
        '200':
          description: Configuración de lienzo visual actualizada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutConfig'
        '400':
          description: Esquema geométrico o coordenadas inválidas
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: No autenticado
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
        '404':
          description: Tenant o menú no encontrado

  /api/v1/admin/menu/publish:
    post:
      tags:
        - Admin - Menu & Canvas Layout
      summary: Publicar menú y desencadenar compilación AOT e invalidación en CDN
      operationId: publishMenu
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuPublishRequest'
      responses:
        '202':
          description: Trabajo de compilación AOT y purgado perimetral iniciado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPublishJobResponse'
        '401':
          description: No autenticado
        '403':
          description: No autorizado por política OPA (Requiere rol owner o tenant_admin)
        '422':
          description: Inconsistencia o error de validación en catálogo o lienzo
        '500':
          description: Error interno durante compilación AOT

  /api/v1/tenants/{tenant_slug}/menu:
    get:
      tags:
        - Public Menu
      summary: Obtener carta digital pública con soporte para layout de lienzo y ETag
      operationId: getPublicMenu
      parameters:
        - name: tenant_slug
          in: path
          required: true
          schema:
            type: string
        - name: table_token
          in: query
          required: false
          schema:
            type: string
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Carta digital recuperada exitosamente
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600, s-maxage=86400
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenuResponse'
        '304':
          description: No Modificado (ETag coincide con If-None-Match)
        '404':
          description: Tenant no encontrado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LayoutConfig:
      type: object
      required:
        - canvas_enabled
      properties:
        canvas_enabled:
          type: boolean
        background_url:
          type: string
          format: uri
          nullable: true
        background_color:
          type: string
          nullable: true
        elements:
          type: array
          items:
            $ref: '#/components/schemas/CanvasElement'

    CanvasElement:
      type: object
      required:
        - dish_id
        - x
        - y
        - z_index
        - width
        - height
      properties:
        dish_id:
          type: string
          format: uuid
        x:
          type: number
        y:
          type: number
        z_index:
          type: integer
        width:
          type: number
        height:
          type: number

    MenuPublishRequest:
      type: object
      properties:
        force_recompile:
          type: boolean
          default: false

    MenuPublishJobResponse:
      type: object
      required:
        - job_id
        - tenant_slug
        - status
        - triggered_at
      properties:
        job_id:
          type: string
          format: uuid
        tenant_slug:
          type: string
        status:
          type: string
          enum: [queued, processing, completed, failed]
        estimated_duration_seconds:
          type: integer
          example: 3
        version_hash:
          type: string
          example: v20260917-a1b2c3d4
        cdn_purge_requested:
          type: boolean
        assets_queued:
          type: integer
        triggered_at:
          type: string
          format: date-time

    PublicMenuResponse:
      type: object
      required:
        - tenant_name
        - tenant_slug
        - categories
      properties:
        tenant_name:
          type: string
        tenant_slug:
          type: string
        table_number:
          type: integer
          nullable: true
        branding:
          type: object
        layout_config:
          $ref: '#/components/schemas/LayoutConfig'
        categories:
          type: array
          items:
            type: object

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string