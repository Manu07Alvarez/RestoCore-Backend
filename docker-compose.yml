services:
  postgres:
    image: postgres:16-alpine
    container_name: restocore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restocore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-restocore}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: restocore-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: restocore-seaweedfs
    command: "server -s3 -filer -ip.bind=0.0.0.0"
    ports:
      - "8333:8333"
      - "8888:8888"
      - "9333:9333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1;' || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  create-bucket:
    image: curlimages/curl:latest
    container_name: restocore-create-bucket
    depends_on:
      seaweedfs:
        condition: service_started
    command: >
      sh -c "sleep 3 && curl -s -X PUT http://seaweedfs:8333/restocore-images || exit 0"
    restart: "no"

  opa:
    image: openpolicyagent/opa:latest
    container_name: restocore-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
    ports:
      - "8181:8181"
    restart: unless-stopped

volumes:
  postgres_data:
  seaweedfs_data:
