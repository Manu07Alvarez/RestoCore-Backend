services:
  postgres:
    image: postgres:16-alpine
    container_name: restocore-postgres-dev
    environment:
      POSTGRES_DB: restocore_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restocore_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: restocore-redis-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: restocore-seaweedfs-dev
    command: "server -s3 -filer -ip.bind=0.0.0.0"
    ports:
      - "8333:8333" # S3 gateway
      - "8888:8888" # Filer HTTP
      - "9333:9333" # Master
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1;' || exit 0"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: curlimages/curl:latest
    container_name: restocore-create-bucket-dev
    depends_on:
      seaweedfs:
        condition: service_started
    command: >
      sh -c "sleep 3 && curl -s -X PUT http://seaweedfs:8333/restocore-images || exit 0"
    restart: "no"

  opa:
    image: openpolicyagent/opa:latest
    container_name: restocore-opa-dev
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./specs/policies:/policies:ro
    ports:
      - "8181:8181"

volumes:
  postgres_dev_data:
  seaweedfs_data:
